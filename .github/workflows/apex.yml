name: build

# Phone-only pipeline. Everything that needs a real computer happens here.
#   bundle -> builds the map archive + vendors libraries
#   pages  -> browser build, for checking a change without installing
#   apk    -> Stage 1: installable APK on the Releases tab
#
# Run it from the Actions tab ("Run workflow") or just push.

on:
  workflow_dispatch:
  push:
    paths:
      # The seed zip is what Jacob uploads; without it here an upload does
      # not even start a run (take 119, landmine 202).
      - 'apex-seed*.zip'
      - BUILD
      - 'src/**'
      - 'tools/**'
      - regions.json
      - package.json
      - package-lock.json
      - capacitor.config.json
      - 'signing/**'

concurrency:
  group: build
  cancel-in-progress: true


permissions:
  contents: write
  pages: write
  id-token: write

env:
  # The region — bbox, anchors, imagery zoom — lives in regions.json.
  # ── TAKE 118: REGION AUTHORITY LIVES IN THE SEED, NOT HERE ──────────────
  # This file once pinned APEX_REGION and a hand-bumped TILES_KEY. When the
  # seed switched to ALL OF MICHIGAN, this override kept commanding the box —
  # CI shipped the wrong state wearing take 117 at full green (landmine 199).
  # Now: regions.json's `default` decides, a step below derives the cache key
  # from it, and ci/bundle.sh (seed-updated) verifies the built bundle names
  # the declared region. NEVER add APEX_REGION back here.
  DATA_V: v3   # bump only to force a clean data pull

jobs:
  # ── Stage -1: unpack the seed ───────────────────────────────────────────
  # TAKE 119 (landmine 202): the take-118 paste of this file DROPPED this job.
  # It was the only thing that ever moved a seed zip into the tree, so every
  # run after the paste rebuilt whatever source was already committed — take
  # 118, forever — while the bundle job's comments went on describing a seed
  # job that no longer existed. If the workflow file is ever rewritten again:
  # this job must survive, and 'apex-seed*.zip' must stay in push.paths.
  #
  # Pushes with GITHUB_TOKEN do not start workflows, which is why bundle runs
  # in THIS workflow with `needs: seed` and checks out ref_name (landmine 85).
  # GITHUB_TOKEN cannot write .github/workflows, which is why the seed carries
  # ci/build.yml for hand-pasting and never the workflow itself (landmine 46).
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Unpack any seed zip at the repo root and commit it
        run: |
          shopt -s nullglob
          zips=(apex-seed*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no seed zip at root — building the committed tree as-is"
            exit 0
          fi
          z="${zips[-1]}"
          echo "seed: $z  sha256 $(sha256sum "$z" | cut -c1-16)…"
          unzip -o -q "$z" -x '.github/*'
          rm -f apex-seed*.zip
          take=$(grep -oP 'OFFROAD_TAKE=\K[0-9]+' BUILD || echo '?')
          git config user.name  "apex-seed"
          git config user.email "apex-seed@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "seed identical to the tree — nothing to commit (take $take)"
            exit 0
          fi
          git commit -q -m "seed: take $take from $z"
          git push
          echo "committed take $take"

  # ────────────────────────────────────────────────────────────────────────
  bundle:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 90   # statewide first build ~40-60 min; cached ~10-15
    steps:
      # ref is REQUIRED here. checkout defaults to the commit that TRIGGERED the
      # run; the seed job pushes a newer one, so a default checkout lands on a
      # tree without ci/bundle.sh and fails with "No such file or directory"
      # (landmine 85). ref_name follows the branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Fail here, plainly, rather than 200 lines later inside npm or python.
      # Jacob uploaded the wrong zip and got a Node error that said nothing
      # about the actual problem (landmine 78).
      - name: Check the repo actually contains the project
        run: |
          missing=
          for f in BUILD tools/pipeline.py src/app.html regions.json package.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::This repo has no APEX source. Missing:$missing"
            echo ""
            echo "The seed step unpacks apex-seed.zip from the repo ROOT."
            echo "Files present at root:"; ls -A | sed 's/^/  /'
            echo ""
            echo "Upload **apex-seed.zip** (not apex-orv-github-repo.zip, which"
            echo "nests everything under an apex-orv/ folder), commit it to the"
            echo "root, and run this workflow again."
            exit 1
          fi
          echo "source present — take $(grep -oP 'OFFROAD_TAKE=\K[0-9]+' BUILD)"

      - name: Derive region from the seed (take 118)
        id: region
        run: |
          R=$(python3 -c "import json;print(json.load(open('regions.json'))['default'])")
          echo "id=$R" >> "$GITHUB_OUTPUT"
          echo "Seed declares region: $R"

      - name: Restore region artifacts
        id: tilecache
        uses: actions/cache@v4
        with:
          # EVERY per-region payload, by the same *_payload.json convention
          # region.py clears by — plus the input caches. This was a hand-written
          # list and it had drifted exactly as region.DERIVED did: poi (take 89),
          # contour (91) and corridor (102) were all missing, so every build
          # re-ran them. osm_cache was missing too, so every build re-downloaded
          # the 297 MB Michigan extract and spent ~5 minutes on the corridor step
          # for a result it already had. Found by the take-107 audit, not by
          # anything watching (landmine 170).
          path: |
            ./*_payload.json
            hillshade.jpg
            imagery.jpg
            imagery_meta.json
            imagery_budget.json
            imagery_tiles.json
            imagery_tiles
            dem_meta.json
            aoi.json
            authoritative.json
            dem_cache
            img_cache
            osm_cache
            auth_cache
            region_stamp.json
          key: region-${{ steps.region.outputs.id }}-${{ env.DATA_V }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the region, render it, and gate
        # Every step that can change lives in ci/bundle.sh, which the seed job
        # updates. The workflow file is pasted by hand and cannot be (landmine 84).
        run: bash ci/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 7

  # ── Stage 0 ─────────────────────────────────────────────────────────────
  # Needs Settings -> Pages -> Source: "GitHub Actions" once, from the phone.
  # Allowed to fail so a un-enabled Pages doesn't block the APK.
  pages:
    needs: bundle
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ── Stage 1 ─────────────────────────────────────────────────────────────
  apk:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ref is REQUIRED here. checkout defaults to the commit that TRIGGERED the
      # run; the seed job pushes a newer one, so a default checkout lands on a
      # tree without ci/bundle.sh and fails with "No such file or directory"
      # (landmine 85). ref_name follows the branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 requires Node 22+

      # ubuntu-latest preinstalls the Android SDK (ANDROID_HOME set) and
      # setup-java provides a full JDK. Neither was true of the container this
      # was proven in — landmine 40 — so the job calls the exact tool that
      # produced a working APK there, instead of its own copy of the steps.
      # Every job is a FRESH runner: the bundle job's pip install does not carry
      # over. android.py imports icon.py which needs PIL, and the apk job had no
      # Python deps at all (landmine 83).
      # Play kit: apk.sh now also builds the Play AAB. The upload key is
      # a repository SECRET (never in the tree); the workflow only passes it
      # through as env. All logic lives in ci/apk.sh, which the seed updates.
      # No secrets set → the AAB is built dev-key-signed and NAMED unfit to
      # upload; the job still succeeds so sideload testing never blocks.
      - name: Build the signed APK and the Play AAB
        id: pkg
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_STORE_PASS: ${{ secrets.PLAY_UPLOAD_STORE_PASS }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASS }}
        run: bash ci/apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.pkg.outputs.apk }}

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: ${{ steps.pkg.outputs.aab }}

      # Notes come from ci/RELEASE.md, in the REPO. They used to be inline here —
      # and the workflow is the one file the seed cannot update, so the notes
      # were frozen at whatever take the user last pasted. Jacob was still
      # reading "Install from this page on the Fold" two takes after I changed
      # it (landmine 96).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "take-${{ github.run_number }}" \
            "${{ steps.pkg.outputs.apk }}" "${{ steps.pkg.outputs.aab }}" \
            "$(ls play-assets-*.zip)" \
            --title "APEX ORV — take ${{ steps.pkg.outputs.take }}" \
            --notes-file ci/RELEASE.md
