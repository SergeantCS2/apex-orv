name: APEX

# Phone-only pipeline. Everything that needs a real computer happens here.
#   bundle -> builds the map archive + vendors libraries
#   pages  -> Stage 0: open it in Chrome on the Fold, run PAN TEST
#   apk    -> Stage 1: installable APK on the Releases tab
#
# Run it from the Actions tab ("Run workflow") or just push.

on:
  workflow_dispatch:
  push:
    paths:
      - apex-seed.zip
      - apex-orv-github-repo.zip
      - BUILD
      - 'src/**'
      - 'tools/**'
      - regions.json
      - package.json
      - package-lock.json
      - capacitor.config.json
      - 'signing/**'

concurrency:
  group: build
  cancel-in-progress: true


permissions:
  contents: write
  pages: write
  id-token: write

env:
  # The region — bbox, anchors, imagery zoom — lives in regions.json.
  # Change which one CI builds here; bump TILES_KEY in the same commit or the
  # cache will hand back the previous region's artifacts.
  APEX_REGION: neml-bullgap
  TILES_KEY: neml-v2

jobs:
  # ── one-file installer ──────────────────────────────────────────────────
  # Unpacks a seed zip sitting in the repo root the first time, then gets out of
  # the way. It exists because GitHub's mobile web UI cannot create folders from
  # an upload, and GITHUB_TOKEN cannot write .github/workflows — so the installer
  # has to BE the build rather than write it (landmines 42, 46, 77).
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack a seed zip if one is sitting in the repo root
        run: |
          ZIP=""
          for c in apex-seed.zip apex-orv-github-repo.zip; do
            [ -f "$c" ] && ZIP="$c" && break
          done
          if [ -z "$ZIP" ]; then
            echo "no seed zip in the repo root — nothing to unpack, going"
            echo "straight to the build (normal after the first run)"
            exit 0
          fi
          echo "unpacking $ZIP"
          unzip -oq "$ZIP" -d _seed
          # apex-orv-github-repo.zip nests everything under one folder; the plain
          # seed does not. Flatten either shape so the reasonable wrong choice
          # still works (landmine 78).
          SRC=_seed
          if [ ! -f _seed/BUILD ] && [ "$(ls -1 _seed | wc -l)" = "1" ]; then
            SRC="_seed/$(ls -1 _seed)"
            echo "  (nested zip — flattening $SRC)"
          fi
          # NEVER write .github/workflows: GITHUB_TOKEN is refused there
          # (landmine 46), and the workflow running this IS the build — a
          # second copy would run everything twice. Whatever you pasted stays.
          rm -rf "$SRC/.github"
          cp -a "$SRC/." .
          rm -rf _seed "$ZIP"
          echo "unpacked $(find . -type f -not -path './.git/*' | wc -l) files"
          # Gate BEFORE committing: a bad seed must not half-populate the repo.
          # APEX_GATE_SEED=1 skips the workflow-file checks: the workflow here is
          # the one YOU pasted, not part of the seed, and it cannot be updated by
          # this job (GITHUB_TOKEN has no workflows permission). Gating the seed
          # against it would deadlock — the fix ships in the seed the gate is
          # refusing to install (landmine 84).
          python3 -m pip install --quiet pyyaml
          APEX_GATE_SEED=1 python3 tools/gate.py
          git config user.name  apex-seed
          git config user.email seed@users.noreply.github.com
          git add -A
          git commit -m "seed: APEX ORV" || echo "nothing new"
          git push
  # ────────────────────────────────────────────────────────────────────────
  bundle:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # ref is REQUIRED here. checkout defaults to the commit that TRIGGERED the
      # run; the seed job pushes a newer one, so a default checkout lands on a
      # tree without ci/bundle.sh and fails with "No such file or directory"
      # (landmine 85). ref_name follows the branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Fail here, plainly, rather than 200 lines later inside npm or python.
      # Jacob uploaded the wrong zip and got a Node error that said nothing
      # about the actual problem (landmine 78).
      - name: Check the repo actually contains the project
        run: |
          missing=
          for f in BUILD tools/pipeline.py src/app.html regions.json package.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::This repo has no APEX source. Missing:$missing"
            echo ""
            echo "The seed step unpacks apex-seed.zip from the repo ROOT."
            echo "Files present at root:"; ls -A | sed 's/^/  /'
            echo ""
            echo "Upload **apex-seed.zip** (not apex-orv-github-repo.zip, which"
            echo "nests everything under an apex-orv/ folder), commit it to the"
            echo "root, and run this workflow again."
            exit 1
          fi
          echo "source present — take $(grep -oP 'OFFROAD_TAKE=\K[0-9]+' BUILD)"

      - name: Restore region artifacts
        id: tilecache
        uses: actions/cache@v4
        with:
          path: |
            graph_payload.json
            terrain_payload.json
            glyphs_payload.json
            water_payload.json
            hillshade.jpg
            imagery.jpg
            imagery_meta.json
            aoi.json
            authoritative.json
            context_payload.json
            address_payload.json
            dem_cache
            img_cache
          key: region-${{ env.TILES_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the region, render it, and gate
        # Every step that can change lives in ci/bundle.sh, which the seed job
        # updates. The workflow file is pasted by hand and cannot be (landmine 84).
        run: bash ci/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 7

  # ── Stage 0 ─────────────────────────────────────────────────────────────
  # Needs Settings -> Pages -> Source: "GitHub Actions" once, from the phone.
  # Allowed to fail so a un-enabled Pages doesn't block the APK.
  pages:
    needs: bundle
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ── Stage 1 ─────────────────────────────────────────────────────────────
  apk:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ref is REQUIRED here. checkout defaults to the commit that TRIGGERED the
      # run; the seed job pushes a newer one, so a default checkout lands on a
      # tree without ci/bundle.sh and fails with "No such file or directory"
      # (landmine 85). ref_name follows the branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ubuntu-latest preinstalls the Android SDK (ANDROID_HOME set) and
      # setup-java provides a full JDK. Neither was true of the container this
      # was proven in — landmine 40 — so the job calls the exact tool that
      # produced a working APK there, instead of its own copy of the steps.
      # Every job is a FRESH runner: the bundle job's pip install does not carry
      # over. android.py imports icon.py which needs PIL, and the apk job had no
      # Python deps at all (landmine 83).
      - name: Build the signed APK
        id: pkg
        run: bash ci/apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.pkg.outputs.apk }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "take-${{ github.run_number }}" \
            "${{ steps.pkg.outputs.apk }}" \
            --title "APEX ORV — take ${{ steps.pkg.outputs.take }}" \
            --notes "Signed release build (~50 MB — satellite tiles at 3.4 m/px). Install from this page on the Fold.

          Then: airplane mode on, force-stop, reopen. The map has to render
          identically and the NET badge has to stay green. Tap PAN TEST and
          report avg fps, p99 min fps, and the badge states."
