name: APEX

# ONE file. Paste this, drop apex-seed.zip in the repo root, press Run.
#
# The seed job unpacks the zip into the repo the first time and then gets out of
# the way; every run after that just builds. It exists because GitHub's mobile
# web UI cannot create folders from an upload, and GITHUB_TOKEN cannot write
# .github/workflows — so the installer has to BE the build rather than write it
# (landmines 42, 46, 77).

on:
  workflow_dispatch:
  push:
    paths:
      - apex-seed.zip
      - BUILD
      - src/**
      - tools/**
      - regions.json
      - package.json
      - package-lock.json
      - signing/**

concurrency:
  group: apex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack apex-seed.zip if it is sitting in the repo root
        run: |
          if [ ! -f apex-seed.zip ]; then
            echo "no seed zip — nothing to unpack, going straight to the build"
            exit 0
          fi
          unzip -o apex-seed.zip -d .
          rm -f apex-seed.zip
          echo "unpacked $(find . -type f -not -path './.git/*' | wc -l) files"
          # Gate BEFORE committing: a bad seed must not half-populate the repo.
          python3 tools/gate.py
          git config user.name  apex-seed
          git config user.email seed@users.noreply.github.com
          git add -A
          git commit -m "seed: APEX ORV" || echo "nothing new"
          git push
  # ────────────────────────────────────────────────────────────────────────
  bundle:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore region artifacts
        id: tilecache
        uses: actions/cache@v4
        with:
          path: |
            graph_payload.json
            terrain_payload.json
            glyphs_payload.json
            water_payload.json
            hillshade.jpg
            imagery.jpg
            imagery_meta.json
            aoi.json
            authoritative.json
            context_payload.json
            address_payload.json
            dem_cache
            img_cache
          key: region-${{ env.TILES_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pipeline dependencies
        run: pip install --quiet pillow numpy scipy

      - name: Build the region
        # Unconditional — landmine 44. Skipping on cache-hit left bundles/ and
        # www/bundle unbuilt, so every SECOND build died at the manifest cp.
        # With dem/img caches restored, a warm run is ~30s and still executes
        # bundle, build_app, and both smokes.
        run: python3 tools/pipeline.py

      - name: Bundle and assemble
        run: |
          # pipeline.py already ran bundle + build_app; just place the manifest
          cp "bundles/$APEX_REGION/manifest.json" www/bundle/manifest.json
          mkdir -p www/vendor
          # The CSP build plus a real worker file: Android WebView could not
          # start MapLibre's blob: worker, so every source-backed layer drew
          # nothing while background and DOM markers looked fine (landmine 47).
          for f in maplibre-gl.css maplibre-gl-csp.js maplibre-gl-csp-worker.js; do
            curl -fsSL -o "www/vendor/$f" "https://unpkg.com/maplibre-gl@5/dist/$f"
          done
          test -s www/vendor/maplibre-gl-csp-worker.js

      # The render check is what found a map that had drawn nothing for 14
      # takes. Without a browser in CI the gate merely NOTES that it skipped —
      # which is how the bug survived two audits (landmine 53).
      - name: Install Chrome for the render check
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx puppeteer browsers install chrome

      - name: Render the app in a real browser
        run: node tools/render.mjs

      - name: Gate
        run: python3 tools/gate.py

      - name: Report size
        run: |
          echo "### Region bundle" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -h www/bundle/* www/vendor/* >> $GITHUB_STEP_SUMMARY
          du -sh www >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 7

  # ── Stage 0 ─────────────────────────────────────────────────────────────
  # Needs Settings -> Pages -> Source: "GitHub Actions" once, from the phone.
  # Allowed to fail so a un-enabled Pages doesn't block the APK.
  pages:
    needs: bundle
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ── Stage 1 ─────────────────────────────────────────────────────────────
  apk:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ubuntu-latest preinstalls the Android SDK (ANDROID_HOME set) and
      # setup-java provides a full JDK. Neither was true of the container this
      # was proven in — landmine 40 — so the job calls the exact tool that
      # produced a working APK there, instead of its own copy of the steps.
      - name: Generate and patch the Android project
        run: python3 tools/android.py

      - name: Copy the region into assets
        run: npx cap sync android

      - name: Build the signed APK
        run: cd android && ./gradlew assembleRelease --no-daemon -q

      - name: Name it after the take
        id: take
        run: |
          T=$(grep -oP 'OFFROAD_TAKE=\K[0-9]+' BUILD)
          echo "take=$T" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "apex-offroad-take-$T.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.pkg.outputs.apk }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "take-${{ github.run_number }}" \
            "${{ steps.pkg.outputs.apk }}" \
            --title "APEX ORV — take ${{ steps.take.outputs.take }}" \
            --notes "Signed release build (~50 MB — satellite tiles at 3.4 m/px). Install from this page on the Fold.

          Then: airplane mode on, force-stop, reopen. The map has to render
          identically and the NET badge has to stay green. Tap PAN TEST and
          report avg fps, p99 min fps, and the badge states."
