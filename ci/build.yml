name: build

# Phone-only pipeline. Everything that needs a real computer happens here.
#   bundle -> builds the map archive + vendors libraries
#   pages  -> Stage 0: open it in Chrome on the Fold, run PAN TEST
#   apk    -> Stage 1: installable APK on the Releases tab
#
# Run it from the Actions tab ("Run workflow") or just push.

on:
  workflow_dispatch:
  push:
    paths:
      - BUILD
      - 'src/**'
      - 'tools/**'
      - regions.json
      - package.json
      - package-lock.json
      - capacitor.config.json
      - 'signing/**'

concurrency:
  group: build
  cancel-in-progress: true


permissions:
  contents: write
  pages: write
  id-token: write

env:
  # The region — bbox, anchors, imagery zoom — lives in regions.json.
  # Change which one CI builds here; bump TILES_KEY in the same commit or the
  # cache will hand back the previous region's artifacts.
  APEX_REGION: neml-bullgap
  TILES_KEY: neml-v2

jobs:
  # ────────────────────────────────────────────────────────────────────────
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Fail here, plainly, rather than 200 lines later inside npm or python.
      # Jacob uploaded the wrong zip and got a Node error that said nothing
      # about the actual problem (landmine 78).
      - name: Check the repo actually contains the project
        run: |
          missing=
          for f in BUILD tools/pipeline.py src/app.html regions.json package.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::This repo has no APEX source. Missing:$missing"
            echo ""
            echo "The seed step unpacks apex-seed.zip from the repo ROOT."
            echo "Files present at root:"; ls -A | sed 's/^/  /'
            echo ""
            echo "Upload **apex-seed.zip** (not apex-orv-github-repo.zip, which"
            echo "nests everything under an apex-orv/ folder), commit it to the"
            echo "root, and run this workflow again."
            exit 1
          fi
          echo "source present — take $(grep -oP 'OFFROAD_TAKE=\K[0-9]+' BUILD)"

      - name: Restore region artifacts
        id: tilecache
        uses: actions/cache@v4
        with:
          path: |
            graph_payload.json
            terrain_payload.json
            glyphs_payload.json
            water_payload.json
            hillshade.jpg
            imagery.jpg
            imagery_meta.json
            aoi.json
            authoritative.json
            context_payload.json
            address_payload.json
            dem_cache
            img_cache
          key: region-${{ env.TILES_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pipeline dependencies
        # pyyaml is not optional: gate.py uses it to reject duplicate keys in
        # workflow files, and without it that check silently downgrades to a
        # note — which is how an invalid workflow survived 30 takes (landmine 79).
        run: pip install --quiet pillow numpy scipy pyyaml

      - name: Build the region
        # Unconditional — landmine 44. Skipping on cache-hit left bundles/ and
        # www/bundle unbuilt, so every SECOND build died at the manifest cp.
        # With dem/img caches restored, a warm run is ~30s and still executes
        # bundle, build_app, and both smokes.
        run: python3 tools/pipeline.py

      - name: Bundle and assemble
        run: |
          # pipeline.py already ran bundle + build_app; just place the manifest
          cp "bundles/$APEX_REGION/manifest.json" www/bundle/manifest.json
          mkdir -p www/vendor
          # The CSP build plus a real worker file: Android WebView could not
          # start MapLibre's blob: worker, so every source-backed layer drew
          # nothing while background and DOM markers looked fine (landmine 47).
          for f in maplibre-gl.css maplibre-gl-csp.js maplibre-gl-csp-worker.js; do
            curl -fsSL -o "www/vendor/$f" "https://unpkg.com/maplibre-gl@5/dist/$f"
          done
          test -s www/vendor/maplibre-gl-csp-worker.js

      # The render check is what found a map that had drawn nothing for 14
      # takes. Without a browser in CI the gate merely NOTES that it skipped —
      # which is how the bug survived two audits (landmine 53).
      - name: Install Chrome for the render check
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx puppeteer browsers install chrome

      - name: Render the app in a real browser
        run: node tools/render.mjs

      - name: Gate
        run: python3 tools/gate.py

      - name: Report size
        run: |
          echo "### Region bundle" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -h www/bundle/* www/vendor/* >> $GITHUB_STEP_SUMMARY
          du -sh www >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 7

  # ── Stage 0 ─────────────────────────────────────────────────────────────
  # Needs Settings -> Pages -> Source: "GitHub Actions" once, from the phone.
  # Allowed to fail so a un-enabled Pages doesn't block the APK.
  pages:
    needs: bundle
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ── Stage 1 ─────────────────────────────────────────────────────────────
  apk:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ubuntu-latest preinstalls the Android SDK (ANDROID_HOME set) and
      # setup-java provides a full JDK. Neither was true of the container this
      # was proven in — landmine 40 — so the job calls the exact tool that
      # produced a working APK there, instead of its own copy of the steps.
      - name: Generate and patch the Android project
        run: python3 tools/android.py

      - name: Copy the region into assets
        run: npx cap sync android

      - name: Build the signed APK
        run: cd android && ./gradlew assembleRelease --no-daemon -q

      # The apk PATH must be an output of this step. It was referenced as
      # steps.pkg.outputs.apk and no step has id 'pkg', so it resolved to an
      # EMPTY STRING: upload-artifact got no path and `gh release create` got no
      # asset. Every release would have published with no APK attached
      # (landmine 78). Renamed too — the app became APEX ORV at take 38.
      - name: Name it after the take
        id: pkg
        run: |
          T=$(grep -oP 'OFFROAD_TAKE=\K[0-9]+' BUILD)
          echo "take=$T" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "apex-orv-take-$T.apk"
          echo "apk=apex-orv-take-$T.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.pkg.outputs.apk }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "take-${{ github.run_number }}" \
            "${{ steps.pkg.outputs.apk }}" \
            --title "APEX ORV — take ${{ steps.pkg.outputs.take }}" \
            --notes "Signed release build (~50 MB — satellite tiles at 3.4 m/px). Install from this page on the Fold.

          Then: airplane mode on, force-stop, reopen. The map has to render
          identically and the NET badge has to stay green. Tap PAN TEST and
          report avg fps, p99 min fps, and the badge states."
